<div class="modal-fondo" (click)="cerrar.emit()">
  <form class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-pedir" (click)="$event.stopPropagation()" (keydown.escape)="cerrar.emit()" (submit)="$event.preventDefault(); registrar()">
    <div class="modal__encabezado">
      <div>
        <h2 class="modal__titulo" id="titulo-pedir">Pedido a proveedor {{ folio }}</h2>
        <p class="modal__subtitulo">{{ subtitulo() }}</p>
      </div>
      <button type="button" class="modal__cerrar" aria-label="Cerrar" (click)="cerrar.emit()"><img src="assets/inventario/x.svg" width="20" height="20" alt="" /></button>
    </div>

    @if (sinAprobar(); as o) {
      <p class="aviso aviso--advertencia"><img src="assets/inventario/alert-advertencia.svg" width="16" height="16" alt="" />La re-cotización de {{ o.folio }} todavía no la aprueba {{ o.cliente.nombre.split(' ')[0] }}. Pide solo si ya aceptó o si quieres tenerla lista.</p>
    }

    <label class="campo">
      <span class="campo__etiqueta">Proveedor *</span>
      <span class="campo__control campo__control--40">
        <select class="campo__input campo__select" (change)="proveedor.set($any($event.target).value)">
          @for (p of proveedores; track p) {
            <option [value]="p" [selected]="p === proveedorElegido()">{{ p }}</option>
          }
        </select>
        <img src="assets/cajera/chev-d.svg" width="16" height="16" alt="" />
      </span>
    </label>

    <div class="tres">
      <label class="campo">
        <span class="campo__etiqueta">Cantidad *</span>
        <span class="campo__control campo__control--40"><input class="campo__input" type="number" [min]="solicitud().cantidad" step="1" [value]="cantidadElegida()" (change)="cantidad.set(+$any($event.target).value || solicitud().cantidad)" /></span>
      </label>
      <label class="campo">
        <span class="campo__etiqueta">Costo unitario</span>
        <span class="campo__control campo__control--40">$<input class="campo__input" type="number" min="0" step="0.01" [value]="costoElegido().toFixed(2)" (change)="costo.set(+$any($event.target).value || 0)" /></span>
      </label>
      <label class="campo">
        <span class="campo__etiqueta">Llega</span>
        <span class="campo__control campo__control--40">
          <img src="assets/inventario/calendar.svg" width="16" height="16" alt="" />
          <input class="campo__input" type="date" [value]="llega()" (click)="$any($event.target).showPicker?.()" (input)="llega.set($any($event.target).value)" />
        </span>
      </label>
    </div>

    @if (extraSugerido()) {
      <label class="casilla"><input type="checkbox" [checked]="extra()" (change)="alternarExtra($any($event.target).checked)" />Pedir {{ extraSugerido() }} extra para stock (mínimo: {{ producto()?.minimo }})</label>
    }
    <label class="casilla"><input type="checkbox" [checked]="avisar()" (change)="avisar.set($any($event.target).checked)" />Avisar al técnico cuando llegue</label>

    <div class="dos">
      <label class="campo">
        <span class="campo__etiqueta">Forma de pago *</span>
        <span class="campo__control campo__control--40">
          <select class="campo__input campo__select" (change)="pago.set($any($event.target).value)">
            @for (p of pagos; track p.id) {
              <option [value]="p.id" [selected]="p.id === pago()">{{ p.texto }}</option>
            }
          </select>
          <img src="assets/cajera/chev-d.svg" width="16" height="16" alt="" />
        </span>
      </label>
      <label class="campo">
        <span class="campo__etiqueta">Recibe</span>
        <span class="campo__control campo__control--40">
          <select class="campo__input campo__select" (change)="recibe.set($any($event.target).value)">
            @for (r of recibeOpciones; track r) {
              <option [value]="r" [selected]="r === recibe()">{{ r }}</option>
            }
          </select>
          <img src="assets/cajera/chev-d.svg" width="16" height="16" alt="" />
        </span>
      </label>
    </div>

    <label class="campo">
      <span class="campo__etiqueta">Nota</span>
      <span class="campo__control campo__control--40"><input class="campo__input" type="text" maxlength="160" placeholder="Opcional: cómo se pidió, folio del proveedor…" [value]="nota()" (input)="nota.set($any($event.target).value)" /></span>
    </label>

    <p class="aviso aviso--info"><img src="assets/pdv/alert-primario.svg" width="16" height="16" alt="" />{{ consecuencia() }}</p>

    <div class="modal__acciones">
      <button type="button" class="boton boton--contorno boton--44" (click)="cerrar.emit()">Cancelar</button>
      <button type="submit" class="boton boton--primario boton--44" [disabled]="!valido()"><span class="icono" style="--icono: url(assets/menu/cart.svg)"></span>Registrar pedido</button>
    </div>
  </form>
</div>
