<text x="800.0" y="1862" text-anchor="middle" font-size="14" fill="#64748b">El personal entra con usuario y contraseña (temporal la primera vez; luego crea la suya). El cliente entra al portal con su correo y su contraseña.</text>
<text x="800.0" y="1886" text-anchor="middle" font-size="14" fill="#64748b">«include»: siempre ocurre como parte del otro caso · «extend»: ocurre solo a veces (el descuento lo limita el administrador, máximo 20 %).</text>
