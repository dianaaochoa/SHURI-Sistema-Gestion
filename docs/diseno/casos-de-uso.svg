<text x="800.0" y="1676" text-anchor="middle" font-size="14" fill="#64748b">El personal (cajera, técnico, jefe de técnicos y administrador) inicia sesión con usuario y contraseña; el cliente entra al portal con su folio y teléfono.</text>
<text x="800.0" y="1700" text-anchor="middle" font-size="14" fill="#64748b">«include»: siempre ocurre como parte del otro caso · «extend»: ocurre solo a veces (el descuento lo limita el administrador, máximo 20 %).</text>
